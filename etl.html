<head>

  <style>
    /* ── CSS Variables ───────────────────────────────────────── */
    :root {
      --bg:           #0d1117;
      --bg-surface:   #161b27;
      --card-bg:      #1c2333;
      --card-border:  #2d3748;
      --accent:       #4f6ef7;
      --text:         #e2e8f0;
      --text-muted:   #8892a4;
      --thumb-bg:     #0a0f1a;
      --btn-watch-bg: #4f6ef7;
      --btn-code-bg:  #1e2a3a;
      --btn-code-fg:  #7dd3fc;
      --btn-code-bd:  #2d4a6a;
      --btn-art-bg:   #1e2a2a;
      --btn-art-fg:   #6ee7b7;
      --btn-art-bd:   #2d5a4a;
      --radius:       12px;
      --shadow:       0 4px 24px rgba(0,0,0,0.4);
      --shadow-hover: 0 12px 40px rgba(0,0,0,0.6);
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* ── Reset ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.6; }
    a { color: inherit; text-decoration: none; }

    /* ── Nav ─────────────────────────────────────────────────── */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,17,23,0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
    }
    .nav-inner {
      max-width: 1280px; margin: 0 auto; padding: 0 24px;
      height: 60px; display: flex; align-items: center; justify-content: space-between;
    }
    .nav-brand { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.02em; }
    .nav-brand span { color: var(--accent); }
    .nav-back {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--text-muted); font-size: 0.875rem; font-weight: 500;
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--text); }

    /* ── Page header ─────────────────────────────────────────── */
    .page-header {
      max-width: 1280px; margin: 0 auto; padding: 56px 24px 40px;
    }
    .page-header h1 {
      font-size: clamp(1.6rem, 4vw, 2.5rem);
      font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px;
    }
    .page-header h1 span { color: var(--accent); }
    .page-header p { font-size: 1rem; color: var(--text-muted); max-width: 600px; margin-bottom: 20px; }
    .playlist-link {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 20px; border-radius: 8px; font-size: 0.875rem; font-weight: 600;
      background: var(--btn-watch-bg); color: #fff;
      transition: opacity 0.15s, transform 0.15s;
    }
    .playlist-link:hover { opacity: 0.85; transform: translateY(-1px); }

    /* ── Grid ────────────────────────────────────────────────── */
    .grid-wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px 72px; }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    @media (max-width: 960px) { .video-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) {
      .video-grid { grid-template-columns: 1fr; gap: 16px; }
      .page-header { padding: 36px 16px 28px; }
      .grid-wrap { padding: 0 16px 48px; }
      .nav-inner { padding: 0 16px; }
    }

    /* ── Card ────────────────────────────────────────────────── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent);
    }

    /* thumbnail */
    .card-thumb {
      position: relative; width: 100%; aspect-ratio: 16/9;
      background: var(--thumb-bg); overflow: hidden; display: block;
    }
    .card-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.3s ease;
    }
    .card:hover .card-thumb img { transform: scale(1.04); }
    .play-badge {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.2s;
    }
    .card:hover .play-badge { opacity: 1; }
    .play-badge svg { width: 52px; height: 52px; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6)); }

    /* body */
    .card-body { padding: 16px 16px 0; flex: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 0.95rem; font-weight: 700; color: var(--text); line-height: 1.4; margin-bottom: 8px; }
    .card-desc  { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; flex: 1; }

    /* actions */
    .card-actions { padding: 12px 16px 16px; display: flex; flex-wrap: wrap; gap: 7px; }
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600;
      border: 1px solid transparent; transition: opacity 0.15s, transform 0.15s; white-space: nowrap;

    .btn:hover { opacity: 0.82; transform: translateY(-1px); }
    .btn-watch   { background: var(--btn-watch-bg); color: #fff; border-color: var(--btn-watch-bg); }
    .btn-code    { background: var(--btn-code-bg); color: var(--btn-code-fg); border-color: var(--btn-code-bd); }
    .btn-article { background: var(--btn-art-bg);  color: var(--btn-art-fg);  border-color: var(--btn-art-bd); }

    /* ── Footer ──────────────────────────────────────────────── */
    .footer {
      text-align: center; padding: 32px 24px;
      border-top: 1px solid var(--card-border);
      color: var(--text-muted); font-size: 0.82rem;
    }
    .footer a { color: var(--accent); }

    .thumb-ph{background:linear-gradient(135deg,#1a2540 0%,#0d1117 100%);}
    .thumb-ph::after{content:'\25B6';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2rem;color:var(--accent);opacity:.35;}

  <script>
    (function(){
      var SIZES = ['maxresdefault','sddefault','hqdefault','mqdefault'];
      function attempt(img, idx){
        if(idx >= SIZES.length){ showPlaceholder(img); return; }
        var vid = img.dataset.vid;
        img.onerror = function(){ attempt(img, idx+1); };
        img.onload  = function(){ checkGray(img, idx); };
        img.src = 'https://img.youtube.com/vi/' + vid + '/' + SIZES[idx] + '.jpg';
      }
      function checkGray(img, idx){
        try {
          var c = document.createElement('canvas');
          c.width = c.height = 2;
          var ctx = c.getContext('2d');
          ctx.drawImage(img, Math.floor(img.naturalWidth*.4), Math.floor(img.naturalHeight*.4), 2, 2, 0, 0, 2, 2);
          var d = ctx.getImageData(0,0,2,2).data;
          var gray = true;
          for(var i=0;i<d.length;i+=4){
            if(d[i]<120 || Math.abs(d[i]-d[i+1])>18 || Math.abs(d[i]-d[i+2])>18){ gray=false; break; }
          }
          if(gray){ attempt(img, idx+1); }
        } catch(e){ /* CORS blocked */ }
      }
      function showPlaceholder(img){
        img.style.display='none';
        img.closest('.card-thumb').classList.add('thumb-ph');
      }
      document.querySelectorAll('.card-thumb img[data-vid]').forEach(function(img){
        attempt(img, 0);
      });
    })();
